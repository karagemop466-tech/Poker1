<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARIA Poker Room · Las Vegas Strip Poker Plan</title>
<meta name="description" content="ARIA Poker Room - poker venue on the Las Vegas Strip.">
<style>
:root {
  --bg: #0f1115;
  --bg2: #161a21;
  --card: #1b2029;
  --card2: #212734;
  --line: #2c3341;
  --fg: #e8ecf3;
  --muted: #98a2b5;
  --accent: #63b3ff;
  --accent2: #7ee0b8;
  --warn: #ffc266;
  --bad: #ff8f8f;
  --ok: #7ee0b8;
  --info: #9fc4ff;
  --radius: 10px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--fg);
  font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
code { background: var(--card2); padding: 1px 5px; border-radius: 4px; font-size: 13px; }

/* ------------------------------------------------------------- chrome --- */
.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  background: rgba(15, 17, 21, .96);
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(6px);
}
.brand {
  display: flex;
  align-items: baseline;
  gap: 10px;
  padding: 10px 18px 6px;
}
.brand a { font-weight: 700; font-size: 16px; color: var(--fg); }
.brand .tag {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--accent2);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 1px 8px;
}
.topbar nav {
  display: flex;
  flex-wrap: wrap;
  gap: 2px;
  padding: 0 12px 8px;
}
.topbar nav a {
  color: var(--muted);
  font-size: 13px;
  padding: 5px 9px;
  border-radius: 7px;
}
.topbar nav a:hover { background: var(--card); color: var(--fg); text-decoration: none; }
.topbar nav a.active { background: var(--card2); color: var(--accent); }

main { max-width: 1500px; margin: 0 auto; padding: 20px 18px 60px; }
h1 { font-size: 27px; margin: 8px 0 6px; letter-spacing: -.01em; }
h2 { font-size: 19px; margin: 26px 0 10px; }
h3 { font-size: 15px; margin: 0 0 6px; }
p { margin: 8px 0; }
.lead { color: var(--muted); max-width: 90ch; margin-bottom: 16px; }
.small { font-size: 12.5px; }
.muted { color: var(--muted); }

.footer-inner {
  border-top: 1px solid var(--line);
  padding: 16px 18px 30px;
  color: var(--muted);
  font-size: 13px;
  max-width: 1500px;
  margin: 0 auto;
}

/* --------------------------------------------------------------- cards -- */
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin: 10px 0;
}
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.grid.two { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
.tile { display: block; color: inherit; }
.tile:hover { border-color: var(--accent); text-decoration: none; }
.tile h3 { color: var(--accent); }
.tile p { color: var(--muted); font-size: 13px; }
.callout {
  border-left: 3px solid var(--accent);
  background: var(--card2);
  color: var(--muted);
  font-size: 13.5px;
}
.kpi { margin: 0; }
.kpi-value { font-size: 25px; font-weight: 700; letter-spacing: -.02em; }
.kpi-label { font-size: 13px; color: var(--fg); margin-top: 2px; }

/* ------------------------------------------------------------ toolbar --- */
.toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: 10px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 12px 14px;
  margin: 12px 0;
}
.field { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
.field input, .field select {
  background: var(--bg2);
  color: var(--fg);
  border: 1px solid var(--line);
  border-radius: 7px;
  padding: 7px 9px;
  font-size: 13.5px;
  min-width: 150px;
}
.field.check { flex-direction: row; align-items: center; gap: 7px; color: var(--fg); font-size: 13px; }
.field.check input { min-width: 0; width: 16px; height: 16px; }
.count { margin-left: auto; align-self: center; }
.btn {
  background: var(--card2);
  color: var(--fg);
  border: 1px solid var(--line);
  border-radius: 7px;
  padding: 7px 12px;
  font-size: 13px;
  cursor: pointer;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.small { padding: 4px 8px; font-size: 12px; }

.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 4px; }
.tab {
  background: var(--card);
  color: var(--muted);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 6px 13px;
  font-size: 13px;
  cursor: pointer;
}
.tab.on { background: var(--accent); color: #0b1016; border-color: var(--accent); font-weight: 600; }

/* -------------------------------------------------------------- table --- */
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
thead th {
  background: var(--card2);
  position: sticky;
  top: 0;
  z-index: 2;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: .04em;
  color: var(--muted);
  cursor: pointer;
  white-space: nowrap;
}
tbody tr:hover { background: #1f2531; }
tbody tr:last-child td { border-bottom: none; }
table.kv { font-size: 13.5px; }
table.kv th {
  width: 220px;
  color: var(--muted);
  font-weight: 500;
  cursor: default;
  background: transparent;
  position: static;
  border-bottom: 1px solid var(--line);
  text-transform: none;
  letter-spacing: 0;
}
table.kv td { border-bottom: 1px solid var(--line); }

/* -------------------------------------------------------------- chips --- */
.chip {
  display: inline-block;
  font-size: 11.5px;
  padding: 1px 8px;
  border-radius: 999px;
  border: 1px solid var(--line);
  color: var(--muted);
  white-space: nowrap;
}
.chip.ok { color: var(--ok); border-color: rgba(126, 224, 184, .45); }
.chip.warn { color: var(--warn); border-color: rgba(255, 194, 102, .45); }
.chip.bad { color: var(--bad); border-color: rgba(255, 143, 143, .45); }
.chip.info { color: var(--info); border-color: rgba(159, 196, 255, .45); }
.chip.soft { background: var(--card2); }

ul.notes { margin: 6px 0 0; padding-left: 18px; color: var(--muted); font-size: 13px; }
ul.notes li { margin: 3px 0; }

/* ------------------------------------------------------------- days ----- */
.daylist { display: flex; flex-direction: column; gap: 10px; }
.day { margin: 0; }
.day-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; }
.day-date strong { font-size: 15px; }
.slots { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 10px; }
.slot {
  background: var(--card2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 11px 13px;
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 4px 12px;
  align-items: start;
}
.slot .chip { grid-column: 1 / -1; justify-self: start; }
.slot-time { font-weight: 700; font-size: 16px; }
.slot-name { font-size: 14px; }
.slot-name a { color: var(--fg); }
.slot-name a:hover { color: var(--accent); }
.slot-nums, .slot-meta { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 10px; font-size: 12.5px; color: var(--muted); }
.slot-meta { flex-direction: column; gap: 3px; }
.slot.empty { color: var(--muted); }

/* ------------------------------------------------------------ hotels ---- */
.hotel h3 { display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; }
.entryrow { display: flex; gap: 8px; align-items: center; margin-bottom: 7px; }
.entryrow select { flex: 1; background: var(--bg2); color: var(--fg); border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px; font-size: 13px; }
.entrycost { min-width: 70px; text-align: right; font-variant-numeric: tabular-nums; }

details { margin: 8px 0 0; }
summary { cursor: pointer; color: var(--accent); font-size: 13px; }

/* --------------------------------------------------------- markdown ----- */
#content h1 { font-size: 21px; margin-top: 18px; }
#content h2 { font-size: 17px; border-bottom: 1px solid var(--line); padding-bottom: 5px; }
#content h3 { font-size: 15px; margin-top: 16px; }
#content table { margin: 10px 0; }
#content thead th { position: static; }
#content ul, #content ol { padding-left: 20px; }
#content li { margin: 4px 0; }
#content hr { border: none; border-top: 1px solid var(--line); margin: 18px 0; }
#content blockquote { border-left: 3px solid var(--line); padding-left: 12px; color: var(--muted); margin: 10px 0; }

@media (max-width: 720px) {
  main { padding: 14px 12px 50px; }
  h1 { font-size: 22px; }
  table.kv th { width: auto; }
}

</style>
</head>
<body data-page="venue">
<div id="site-header"></div>
<main>
<h1>ARIA Poker Room</h1>
<p class="lead">3730 Las Vegas Blvd S, Las Vegas, NV 89109</p>
<div class="card callout" id="venueNote"></div>
<div class="grid" id="venueStats"></div>
<div class="toolbar"><label class="field"><span>Search</span><input id="q" type="search" placeholder="Event, series, venue, note, buy-in"></label><label class="field"><span>From</span><input id="from" type="date"></label><label class="field"><span>To</span><input id="to" type="date"></label><label class="field"><span>Venue</span><select id="venue"></select></label><label class="field"><span>Format</span><select id="format"></select></label><label class="field check"><input id="seOnly" type="checkbox"><span>Single entry confirmed only</span></label><span id="count" class="small count"></span><button id="reset" type="button" class="btn">Reset</button></div>
<div id="content"></div>
</main>
<footer id="site-footer"></footer>
<script>
/* Shared site logic. Data is read from JSON and Markdown files in the repo.
   Every path is relative so the site works under a GitHub Pages project URL. */
(function () {
  "use strict";

  var IN_PAGES = /\/pages\//.test(location.pathname);
  var BASE = IN_PAGES ? "../" : "./";

  var NAV = [
    ["index.html", "Home"],
    ["pages/single-entry.html", "Single entry"],
    ["pages/other-formats.html", "Separate formats"],
    ["pages/unverified.html", "Unverified"],
    ["pages/schedule.html", "Schedule"],
    ["pages/venues.html", "Venues"],
    ["pages/hotels.html", "Hotels"],
    ["pages/hotel-rates.html", "Hotel rate log"],
    ["pages/cost.html", "Trip cost"],
    ["pages/daily.html", "Daily feed"],
    ["pages/summary.html", "Executive summary"],
    ["pages/questions.html", "Questions"],
    ["pages/suggestions.html", "Suggestions"],
    ["pages/flagged.html", "Flagged for review"],
    ["pages/irregularities.html", "Irregularity log"],
    ["pages/sources.html", "Official sources"],
    ["pages/review.html", "Repo review"]
  ];

  /* ------------------------------------------------------------ helpers -- */
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }
  function money(v) {
    if (v == null || v === "") return '<span class="muted">blank</span>';
    return "$" + Number(v).toLocaleString("en-US");
  }
  function pct(v) {
    if (v == null) return '<span class="muted">n/a</span>';
    return Number(v).toFixed(2).replace(/\.?0+$/, "") + "%";
  }
  function mult(v) {
    if (v == null) return '<span class="muted">n/a</span>';
    return Number(v).toLocaleString("en-US") + "×";
  }
  function dateFmt(iso) {
    if (!iso) return '<span class="muted">blank</span>';
    var d = new Date(iso + "T12:00:00Z");
    return d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric", year: "numeric", timeZone: "UTC" });
  }
  function timeFmt(hhmm) {
    if (!hhmm) return "";
    var p = hhmm.split(":"), h = +p[0], m = p[1];
    var ap = h >= 12 ? "PM" : "AM";
    var hh = h % 12 === 0 ? 12 : h % 12;
    return hh + ":" + m + " " + ap;
  }
  function weekday(iso) {
    if (!iso) return "";
    return new Date(iso + "T12:00:00Z").toLocaleDateString("en-US", { weekday: "short", timeZone: "UTC" });
  }
  function blank(s) { return s == null || s === ""; }

  function statusChip(s) {
    if (s === "SE") return '<span class="chip ok">Single entry (verified)</span>';
    if (s === "MULTI") return '<span class="chip warn">Multiple entries possible</span>';
    if (s === "RE") return '<span class="chip bad">Re-entry offered</span>';
    if (s === "RESTART") return '<span class="chip info">Day 2 restart (no new entry)</span>';
    return '<span class="chip warn">Unverified</span>';
  }
  function tagChips(tags) {
    if (!tags || !tags.length) return "";
    return tags.map(function (t) {
      return '<span class="chip soft">' + esc(String(t).replace(/_/g, " ")) + "</span>";
    }).join(" ");
  }
  function srcLinks(sources) {
    return (sources || []).map(function (s) {
      return '<a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(s.label) + "</a>";
    }).join("<br>");
  }
  function noteList(notes) {
    if (!notes || !notes.length) return "";
    return '<ul class="notes">' + notes.map(function (n) { return "<li>" + esc(n) + "</li>"; }).join("") + "</ul>";
  }

  function getJSON(path) {
    return fetch(BASE + path, { cache: "no-cache" }).then(function (r) {
      if (!r.ok) throw new Error("Could not load " + path + " (" + r.status + ")");
      return r.json();
    });
  }
  function getText(path) {
    return fetch(BASE + path, { cache: "no-cache" }).then(function (r) {
      if (!r.ok) throw new Error("Could not load " + path + " (" + r.status + ")");
      return r.text();
    });
  }

  /* ------------------------------------------------------- markdown ------ */
  function mdToHtml(md) {
    var lines = md.split(/\r?\n/);
    var out = [], i = 0, listType = null;
    function closeList() {
      if (listType) { out.push(listType === "ul" ? "</ul>" : "</ol>"); listType = null; }
    }
    function inline(t) {
      t = esc(t);
      t = t.replace(/\[([^\]]+)\]\(([^)]+)\)/g, function (m, label, url) {
        return '<a href="' + url + '" target="_blank" rel="noopener">' + label + "</a>";
      });
      t = t.replace(/`([^`]+)`/g, "<code>$1</code>");
      t = t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      t = t.replace(/(^|[^*])\*([^*]+)\*/g, "$1<em>$2</em>");
      return t;
    }
    while (i < lines.length) {
      var line = lines[i];
      if (/^\s*$/.test(line)) { closeList(); i++; continue; }
      var m;
      if ((m = line.match(/^(#{1,6})\s+(.*)$/))) {
        closeList();
        var lvl = m[1].length;
        out.push("<h" + lvl + ">" + inline(m[2]) + "</h" + lvl + ">");
        i++; continue;
      }
      if (/^\s*([-*_])\1{2,}\s*$/.test(line)) { closeList(); out.push("<hr>"); i++; continue; }
      if (/^\|/.test(line)) {
        closeList();
        var rows = [];
        while (i < lines.length && /^\|/.test(lines[i])) { rows.push(lines[i]); i++; }
        var cells = rows.map(function (r) {
          return r.replace(/^\|/, "").replace(/\|$/, "").split("|").map(function (c) { return c.trim(); });
        });
        var head = cells[0], body = cells.slice(1).filter(function (r) {
          return !r.every(function (c) { return /^:?-{2,}:?$/.test(c); });
        });
        var h = "<table><thead><tr>" + head.map(function (c) { return "<th>" + inline(c) + "</th>"; }).join("") + "</tr></thead><tbody>";
        body.forEach(function (r) {
          h += "<tr>" + r.map(function (c) { return "<td>" + inline(c) + "</td>"; }).join("") + "</tr>";
        });
        out.push(h + "</tbody></table>");
        continue;
      }
      if ((m = line.match(/^\s*[-*]\s+(.*)$/))) {
        if (listType !== "ul") { closeList(); out.push("<ul>"); listType = "ul"; }
        out.push("<li>" + inline(m[1]) + "</li>");
        i++; continue;
      }
      if ((m = line.match(/^\s*\d+[.)]\s+(.*)$/))) {
        if (listType !== "ol") { closeList(); out.push("<ol>"); listType = "ol"; }
        out.push("<li>" + inline(m[1]) + "</li>");
        i++; continue;
      }
      closeList();
      out.push("<p>" + inline(line) + "</p>");
      i++;
    }
    closeList();
    return out.join("\n");
  }

  /* ------------------------------------------------------- header/footer - */
  function renderChrome() {
    var here = location.pathname.split("/").pop() || "index.html";
    var nav = NAV.map(function (n) {
      var active = n[0] === here ? ' class="active"' : "";
      return '<a href="' + (IN_PAGES ? "../" : "./") + n[0] + '"' + active + ">" + esc(n[1]) + "</a>";
    }).join("");
    var header = document.getElementById("site-header");
    if (header) {
      header.innerHTML =
        '<div class="topbar"><div class="brand"><a href="' + (IN_PAGES ? "../" : "./") + 'index.html">Las Vegas Strip Poker Plan</a>' +
        '<span class="tag">official sources only</span></div><nav>' + nav + "</nav></div>";
    }
    var footer = document.getElementById("site-footer");
    if (footer) {
      footer.innerHTML =
        '<div class="footer-inner"><p>Built from official resort and tournament-room documents. ' +
        "Blank values are unconfirmed, never inferred. Every row links to the document it was read from.</p>" +
        '<p class="small">Sources last read 2026-11-16. Confirm any price, fee or time with the property before booking. ' +
        'This planner is informational and is not affiliated with any resort.</p></div>';
    }
  }

  /* ---------------------------------------------------------- data cache - */
  var D = {};
  function loadAll() {
    var jobs = [
      getJSON("data/tournaments.json").then(function (d) { D.tournaments = d.rows; }),
      getJSON("data/hotels.json").then(function (d) { D.hotels = d.rows; D.hotelsMeta = d; }),
      getJSON("data/hotel_rates.json").then(function (d) { D.rates = d; }),
      getJSON("data/schedule.json").then(function (d) { D.schedule = d; }),
      getJSON("data/venues.json").then(function (d) { D.venues = d.venues; }),
      getJSON("data/walking.json").then(function (d) { D.walking = d; }),
      getJSON("data/source_registry.json").then(function (d) { D.registry = d; }),
      getJSON("data/source_changes.json").then(function (d) { D.changes = d; }).catch(function () { D.changes = null; })
    ];
    return Promise.all(jobs);
  }

  /* ------------------------------------------------------- toolbar state - */
  function readToolbar() {
    var st = {
      q: (document.getElementById("q") || {}).value || "",
      from: (document.getElementById("from") || {}).value || "",
      to: (document.getElementById("to") || {}).value || "",
      venue: (document.getElementById("venue") || {}).value || "",
      format: (document.getElementById("format") || {}).value || "",
      seOnly: !!(document.getElementById("seOnly") || {}).checked
    };
    return st;
  }
  function wireToolbar(onChange) {
    ["q", "from", "to", "venue", "format", "seOnly"].forEach(function (id) {
      var el = document.getElementById(id);
      if (!el) return;
      el.addEventListener("input", onChange);
      el.addEventListener("change", onChange);
    });
    var reset = document.getElementById("reset");
    if (reset) {
      reset.addEventListener("click", function () {
        ["q", "from", "to"].forEach(function (id) { var e = document.getElementById(id); if (e) e.value = ""; });
        ["venue", "format"].forEach(function (id) { var e = document.getElementById(id); if (e) e.value = ""; });
        var s = document.getElementById("seOnly"); if (s) s.checked = false;
        var w = document.getElementById("walkOnly"); if (w) w.checked = false;
        onChange();
      });
    }
  }
  var FORMAT_LABELS = {
    "plain": "Plain freezeout (no bounty, satellite or team format)",
    "bounty": "Bounty",
    "pko": "Progressive knockout",
    "satellite": "Satellite",
    "milestone": "Milestone satellite",
    "tag_team": "Tag team",
    "multi_flight": "Multi-flight",
    "day1_payout": "Day-one payouts, several flights advance",
    "subsequent_buy_in": "Subsequent buy-in allowed",
    "reentry": "Re-entry offered",
    "title_event": "Title event",
    "turbo": "Turbo",
    "ladies": "Ladies",
    "seniors": "Seniors",
    "two_day": "Runs over two days"
  };
  function fillFormats(select) {
    if (!select) return;
    var seen = {};
    (D.tournaments || []).forEach(function (r) {
      (r.format_tags || []).forEach(function (t) { seen[t] = true; });
    });
    var opts = '<option value="">Any format</option><option value="plain">Plain freezeout (no bounty, satellite or team format)</option>';
    Object.keys(seen).sort().forEach(function (t) {
      opts += '<option value="' + esc(t) + '">' + esc(FORMAT_LABELS[t] || t.replace(/_/g, " ")) + "</option>";
    });
    select.innerHTML = opts;
  }
  function matchesFormat(r, fmt) {
    if (!fmt) return true;
    var tags = r.format_tags || [];
    if (fmt === "plain") {
      return tags.indexOf("bounty") === -1 && tags.indexOf("pko") === -1 &&
             tags.indexOf("satellite") === -1 && tags.indexOf("milestone") === -1 &&
             tags.indexOf("tag_team") === -1;
    }
    return tags.indexOf(fmt) !== -1;
  }
  function fillVenues(select, includeAll) {
    if (!select || !D.venues) return;
    var opts = includeAll ? '<option value="">All venues</option>' : "";
    D.venues.forEach(function (v) {
      opts += '<option value="' + esc(v.id) + '">' + esc(v.name) + "</option>";
    });
    select.innerHTML = opts;
  }
  function matches(r, st) {
    if (st.from && (!r.date || r.date < st.from)) return false;
    if (st.to && (!r.date || r.date > st.to)) return false;
    if (st.venue && r.venue !== st.venue) return false;
    if (st.seOnly && r.entry_status !== "SE") return false;
    if (!matchesFormat(r, st.format)) return false;
    if (st.q) {

  var sortState = { key: "gtd", dir: -1 };

  function renderTable(rows, opts) {
    opts = opts || {};
    var wrap = document.createElement("div");
    wrap.className = "tablewrap";
    var t = document.createElement("table");
    var head = "<thead><tr>";
    COLS.forEach(function (c) {
      if (opts.hide && opts.hide.indexOf(c.key) !== -1) return;
      var arrow = sortState.key === c.key ? (sortState.dir === 1 ? " ▲" : " ▼") : "";
      head += '<th data-sort="' + c.key + '">' + esc(c.label) + arrow + "</th>";
    });
    head += "</tr></thead><tbody>";
    var sorted = rows.slice().sort(function (a, b) {
      var col = null;
      for (var i = 0; i < COLS.length; i++) if (COLS[i].key === sortState.key) col = COLS[i];
      if (!col) return 0;
      var x = col.sort(a), y = col.sort(b);
      if (x === y) return 0;
      return (x > y ? 1 : -1) * sortState.dir;
    });
    sorted.forEach(function (r) {
      head += "<tr>";
      COLS.forEach(function (c) {
        if (opts.hide && opts.hide.indexOf(c.key) !== -1) return;
        head += "<td>" + c.fmt(r) + "</td>";
      });
      head += "</tr>";
    });
    t.innerHTML = head + "</tbody></table>";
    wrap.appendChild(t);
    wrap.querySelectorAll("th[data-sort]").forEach(function (th) {
      th.addEventListener("click", function () {
        var k = th.getAttribute("data-sort");
        if (sortState.key === k) sortState.dir = -sortState.dir;
        else { sortState.key = k; sortState.dir = -1; }
        if (opts.onSort) opts.onSort();
      });
    });
    return wrap;
  }

    if (!listEl) return;
    var hotelSel = document.getElementById("hotel");
    var nightsEl = document.getElementById("nights");
    var adultsEl = document.getElementById("adults");
    var resultEl = document.getElementById("result");
    var noteEl = document.getElementById("hotelNote");
    var entries = [];

    (D.hotels || []).forEach(function (h) {
      hotelSel.innerHTML = (hotelSel.innerHTML || "") + '<option value="' + esc(h.id) + '">' + esc(h.name) + "</option>";
    });

    function pickableRows() {
      return (D.tournaments || []).filter(function (r) {
        return r.buy_in_usd != null && !r.is_restart;
      }).sort(function (a, b) {
        return (a.date || "9999") < (b.date || "9999") ? -1 : 1;
      });
    }

    function drawEntries() {
      var rows = pickableRows();
      if (!entries.length) {
        entries.push({ id: rows.length ? rows[0].id : null });
      }
      listEl.innerHTML = entries.map(function (e, i) {
        var opts = '<option value="">(choose an event)</option>';
        rows.forEach(function (r) {
          var label = (r.date ? r.date + " " : "recurring ") + r.name + " · " + money(r.buy_in_usd);
          opts += '<option value="' + esc(r.id) + '"' + (e.id === r.id ? " selected" : "") + ">" + esc(label) + "</option>";
        });
        return '<div class="entryrow"><select data-i="' + i + '">' + opts + "</select>" +
          '<span class="entrycost" data-c="' + i + '"></span>' +
          '<button type="button" class="btn small" data-rm="' + i + '">Remove</button></div>';
      }).join("");
      listEl.querySelectorAll("select[data-i]").forEach(function (sel) {
        sel.addEventListener("change", function () {
          entries[+sel.getAttribute("data-i")].id = sel.value;
          compute();
        });
      });
      listEl.querySelectorAll("button[data-rm]").forEach(function (b) {
        b.addEventListener("click", function () {
          entries.splice(+b.getAttribute("data-rm"), 1);
          drawEntries();
          compute();
        });
      });
      compute();
    }

    function hotelOf(id) {
      return (D.hotels || []).filter(function (h) { return h.id === id; })[0];
    }

    function compute() {
      var rowById = {};
      (D.tournaments || []).forEach(function (r) { rowById[r.id] = r; });
      var tournamentTotal = 0, count = 0, lines = [];
      entries.forEach(function (e, i) {
        var r = rowById[e.id];
        var cell = listEl.querySelector('[data-c="' + i + '"]');
        if (r && r.buy_in_usd != null) {
          tournamentTotal += r.buy_in_usd;
          count++;
          if (cell) cell.textContent = money(r.buy_in_usd);
          lines.push({ name: r.name, date: r.date, buy: r.buy_in_usd, id: r.id });
        } else if (cell) {
          cell.textContent = "";
        }
      });
      var h = hotelOf(hotelSel.value);
      var nights = Math.max(1, parseInt(nightsEl.value || "1", 10));
      var adults = Math.max(1, parseInt(adultsEl.value || "1", 10));
      var hotelTotal = null;
      if (h && h.true_cost_per_night_usd != null) hotelTotal = h.true_cost_per_night_usd * nights;
      var html = "<h3>Estimated trip cost</h3>";
      html += '<table class="kv"><tbody>';
      html += "<tr><th>Tournament entries</th><td>" + count + " × buy-in = <strong>" +
        (count ? money(tournamentTotal) : '<span class="muted">blank</span>') + "</strong></td></tr>";
      html += "<tr><th>Hotel</th><td>" + (h ? esc(h.name) + " · " + nights + " night" + (nights === 1 ? "" : "s") : '<span class="muted">choose a property</span>') + "</td></tr>";
      html += "<tr><th>True nightly cost</th><td>" +
        (h && h.true_cost_per_night_usd != null ? money(h.true_cost_per_night_usd) + " per night" : '<span class="muted">blank</span>') +
        "</td></tr>";
      html += "<tr><th>Hotel total</th><td>" + (hotelTotal == null ? '<span class="muted">blank</span>' : money(hotelTotal)) + "</td></tr>";
      html += "<tr><th>Estimated trip total</th><td><strong>" +
        (hotelTotal == null ? '<span class="muted">blank until a dated room rate is confirmed</span>' : money(tournamentTotal + hotelTotal)) +
        "</strong></td></tr>";
      html += "</tbody></table>";
      if (h) {
        html += '<p class="small muted">' + esc(h.true_cost_note) + "</p>";
        html += '<p class="small muted">Occupancy used: ' + adults + " adult" + (adults === 1 ? "" : "s") +
          ". " + esc(h.extra_guest_note || "") + "</p>";
      }
      if (lines.length) {
        html += '<details open><summary>Entries used</summary><ul class="notes">';
        lines.forEach(function (l) {
          html += "<li>" + (l.date ? esc(l.date) + " · " : "") + esc(l.name) + " · " + money(l.buy) + "</li>";
        });
        html += "</ul></details>";
      }
      resultEl.innerHTML = html;
      if (noteEl && h) noteEl.textContent = h.poker_rate_note || "";
    }

    document.getElementById("addEntry").addEventListener("click", function () {
      entries.push({ id: null });
      drawEntries();
    });
    hotelSel.addEventListener("change", compute);
    nightsEl.addEventListener("input", compute);
    adultsEl.addEventListener("input", compute);
    drawEntries();
  }

  function pageDaily() {
    var content = document.getElementById("content");
    if (!content) return;
    getJSON("data/daily_feed.json").then(function (d) {
      var note = document.getElementById("note");
      if (note) {
        note.innerHTML = "<strong>Feed status.</strong> Generated " + esc(d.generated_at || "unknown") +
          ". " + esc(d.note || "") + "<br><br>Sources: " + srcLinks(d.sources);
      }
      function draw() {
        var st = readToolbar();
        var rows = (d.rows || []).filter(function (r) {
          if (st.venue && r.venue !== st.venue) return false;
          if (!st.q) return true;
          var hay = (r.name + " " + (r.venue_name || "") + " " + (r.format || "") + " " + (r.notes || "")).toLowerCase();
          return hay.indexOf(st.q.toLowerCase()) !== -1;
        });
        var html = '<div class="tablewrap"><table><thead><tr><th>Venue</th><th>When</th><th>Event</th>' +
          "<th>Format</th><th>Buy-in</th><th>Stack</th><th>Guarantee</th><th>Entry rule</th><th>Source</th></tr></thead><tbody>";
        rows.forEach(function (r) {
          html += "<tr><td>" + esc(r.venue_name || r.venue) + "</td><td>" + esc(r.when || "") + "</td><td>" +
            esc(r.name) + "</td><td>" + esc(r.format || "") + "</td><td>" + money(r.buy_in_usd) + "</td><td>" +
            (r.stack_chips == null ? '<span class="muted">blank</span>' : r.stack_chips.toLocaleString("en-US")) +
            "</td><td>" + money(r.guarantee_usd) + "</td><td>" + (r.entry_rule ? esc(r.entry_rule) : '<span class="muted">blank</span>') +
            "</td><td><a href=\"" + esc(r.source) + "\" target=\"_blank\" rel=\"noopener\">" + esc(r.source_label || "source") + "</a></td></tr>";
        });
        html += "</tbody></table></div>";
        content.innerHTML = html;
        setCount(document.getElementById("count"), rows.length, (d.rows || []).length);
      }
      fillVenues(document.getElementById("venue"), true);
      wireToolbar(draw);
      draw();
    }).catch(function (e) {
      content.innerHTML = '<div class="card callout">The daily feed has not been generated yet. ' + esc(e.message) +
        " Run <code>python3 scripts/scrape_daily.py</code> to build it.</div>";
    });
  }

  function pageSources() {
    var content = document.getElementById("content");
    if (!content) return;
    var status = {};
    if (D.changes && D.changes.results) {
      D.changes.results.forEach(function (r) { status[r.key] = r; });
    }
    var banner = "";
    if (D.changes) {
      banner = '<div class="card callout"><strong>Source watch.</strong> Last checked ' +
        esc(D.changes.checked_at) + ": " + D.changes.total + " documents, " + D.changes.changed +
        " changed, " + D.changes.failed + " could not be fetched. " +
        "<span class=\"muted\">" + esc(D.changes.note) + "</span></div>";
    } else {
      banner = '<div class="card callout"><strong>Source watch.</strong> No source-watch run has been recorded yet. ' +
        "The scheduled job writes its result to <code>data/source_changes.json</code>.</div>";
    }
    function chip(s) {
      if (!s) return '<span class="chip soft">not yet checked</span>';
      if (s.status === "unchanged") return '<span class="chip ok">unchanged</span>';
      if (s.status === "changed") return '<span class="chip bad">changed</span>';
      if (s.status === "baseline") return '<span class="chip info">baseline recorded</span>';
      if (s.status === "error") return '<span class="chip warn" title="' + esc(s.error) + '">fetch failed</span>';
      return '<span class="chip soft">' + esc(s.status) + "</span>";
    }
    function draw() {
      var st = readToolbar();
      var rows = (D.registry ? D.registry.sources : []).filter(function (s) {
        if (!st.q) return true;
        return (s.label + " " + s.url + " " + s.kind).toLowerCase().indexOf(st.q.toLowerCase()) !== -1;
      });
      var html = banner + '<div class="tablewrap"><table><thead><tr><th>Key</th><th>Document</th><th>Kind</th>' +
        "<th>Re-check</th><th>Status</th><th>Checked</th><th>URL</th></tr></thead><tbody>";
      rows.forEach(function (s) {
        var stt = status[s.key];
        html += "<tr><td><code>" + esc(s.key) + "</code></td><td>" + esc(s.label) + "</td><td>" + esc(s.kind) +
          "</td><td>" + esc(s.cadence) + "</td><td>" + chip(stt) + "</td><td>" +
          esc(stt ? stt.checked_at : "") + '</td><td><a href="' + esc(s.url) + '" target="_blank" rel="noopener">' +
          esc(s.url) + "</a></td></tr>";
      });
      html += "</tbody></table></div>";
      content.innerHTML = html;
      setCount(document.getElementById("count"), rows.length, (D.registry ? D.registry.sources.length : 0));
    }
    wireToolbar(draw);
    draw();
  }

  function pageMarkdown(file, target) {
    var el = document.getElementById("content");
    if (!el) return;
    getText(file).then(function (t) {
      el.innerHTML = mdToHtml(t);
    }).catch(function (e) {
      el.innerHTML = '<div class="card callout">Could not load ' + esc(file) + ": " + esc(e.message) + "</div>";
    });
  }

  /* ------------------------------------------------------------- routing - */
  function venueIdFromPath() {
    var m = location.pathname.match(/venue-([a-z]+)\.html/);
    return m ? m[1] : "";
  }

  function start() {
    renderChrome();
    var page = document.body.getAttribute("data-page");
    var vid = venueIdFromPath();
    if (vid) document.body.setAttribute("data-venue", vid);
    var needsData = ["index", "singleEntry", "otherFormats", "unverified", "schedule", "venues",
                     "venue", "hotels", "hotelRates", "cost", "sources", "daily"].indexOf(page) !== -1;
    var ready = needsData ? loadAll() : Promise.resolve();
    ready.then(function () {
      switch (page) {
        case "index": pageKpis(); break;
        case "singleEntry":
          pageTournamentList(function (r) { return r.section === "single"; });
          break;
        case "otherFormats": pageOtherFormats(); break;
        case "unverified":
          pageTournamentList(function (r) { return r.entry_status === "UNV"; });
          break;
        case "schedule": pageSchedule(); break;
        case "venues": pageVenues(); break;
        case "venue": pageVenue(); break;
        case "hotels": pageHotels(); break;
        case "hotelRates": pageHotelRates(); break;
        case "cost": pageCost(); break;
        case "sources": pageSources(); break;
        case "daily": pageDaily(); break;
        case "summary": pageMarkdown("EXECUTIVE_SUMMARY.md"); break;
        case "questions": pageMarkdown("QUESTIONS.md"); break;
        case "suggestions": pageMarkdown("SUGGESTIONS.md"); break;
        case "flagged": pageMarkdown("FLAGGED.md"); break;
        case "irregularities": pageMarkdown("IRREGULARITIES.md"); break;
        case "review": pageMarkdown("REVIEW.md"); break;
        default: break;
      }
    }).catch(function (e) {
      var c = document.getElementById("content");
      if (c) c.innerHTML = '<div class="card callout">Could not load the data: ' + esc(e.message) + "</div>";
      else console.error(e);
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", start);
  } else {
    start();
  }
})();

</script>
</body>
</html>
