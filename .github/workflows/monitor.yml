name: Official source monitor

# Re-checks every official URL on a schedule, records a hash of each document,
# extracts facts from the official structure sheets, and commits the result.
# A row whose source changed is marked on the site (data/change_log.json).

on:
  schedule:
    - cron: "17 13 * * *"   # daily, 13:17 UTC (about 06:17 Las Vegas)
  workflow_dispatch:
  push:
    paths:
      - "scripts/collect_official.py"
      - "scripts/build_data.py"
      - ".github/workflows/monitor.yml"

permissions:
  contents: write

concurrency:
  group: official-monitor
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout the triggering ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install poppler (pdftotext)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Reachability check for official domains
        run: |
          for u in \
            https://www.venetianlasvegas.com/resort/casino/poker/deepstack-extravaganza-poker-tournament/dse-nov-2026.html \
            https://cdn.wynnresorts.com/image/upload/v1757097329/visitwynn_pdfs_files/Poker/WPT/WPT_World_Championship_Schedule.pdf ; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" -A "Mozilla/5.0" --max-time 45 "$u" || echo ERR)
            echo "$code  $u"
            echo "::notice title=reachability::$code $u"
          done

      - name: Collect official facts
        id: collect
        run: |
          set -o pipefail
          {
            echo "run_utc=$(date -u +%FT%TZ)"
            echo "ref=${GITHUB_REF_NAME} commit=$(git rev-parse HEAD)"
            echo "script_sha256=$(sha256sum scripts/collect_official.py | cut -d' ' -f1)"
            echo "pdftotext=$(pdftotext -v 2>&1 | head -1)"
          } | tee collect.log
          python3 scripts/collect_official.py 2>&1 | tee -a collect.log
          test -s data/official_facts.json
          python3 - <<'PYEOF' | tee -a collect.log
          import json
          d = json.load(open('data/official_facts.json'))
          print('facts generated:', d['generated_utc'])
          print('documents:', len(d['documents']), 'structures:', len(d['structures']))
          for k in ('wpt_structures', 'wynn_signature_structures'):
              print(k, 'events:', len(d['series'].get(k, {}).get('events', [])))
          print('wss rows:', d['series'].get('wynn_signature_schedule', {}).get('rows_count'))
          PYEOF

      - name: Rebuild data and site from the collected facts
        run: |
          python3 scripts/build_data.py
          python3 scripts/build_site.py
          python3 scripts/check_links.py

      - name: Commit the collected facts
        run: |
          git config user.name "official-source-monitor"
          git config user.email "monitor@users.noreply.github.com"
          git add -A data index.html pages collect.log
          if git diff --cached --quiet; then
            echo "No change detected in any official document."
            exit 0
          fi
          git commit -m "monitor: refresh official source facts, hashes, and change log ($(date -u +%Y-%m-%d))"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Summarize on failure
        if: failure()
        run: |
          echo "::error title=monitor failure::see collector output below"
          tail -n 25 collect.log 2>/dev/null | while IFS= read -r line; do
            echo "::error title=collector::$line"
          done
