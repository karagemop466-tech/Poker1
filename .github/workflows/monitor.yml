name: Monitor official sources

# Re-checks every official URL the dataset cites, records the result in
# data/monitoring.json, marks every row whose source page printed a different
# value on the last check, and opens an issue when a row needs re-reading.
#
# Two kinds of evidence are recorded and never mixed up:
#   * the HTTP result of the fetch itself (this workflow, on a runner that can
#     reach the operator domains), and
#   * the content comparison against data/source_baseline.json, which is what
#     decides whether a published number or rule actually moved.
# When the machine running the script has no route to those domains, the script
# says so in `kpi_basis` and falls back on the most recent real fetch instead of
# publishing a misleading "all sources unreachable".

on:
  schedule:
    # Morning: 07:17 PST / 08:17 PDT, one hour after the schedule feed.
    # Keep the parallel session's additional overnight check as well.
    - cron: "17 15 * * *"
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      accept_baseline:
        description: "Accept today's fetched content as the new comparison baseline (do this only after the flagged rows have been re-read by hand)"
        required: false
        default: "no"
        type: choice
        options: [no, yes]
  # Run when the monitor implementation changes on main, in addition to the
  # scheduled checks. A validation run on a feature branch uses --print only and
  # never publishes a report.
  push:
    branches: [main]
    paths:
      - ".github/workflows/monitor.yml"
      - "scripts/monitor_sources.py"
      - "scripts/check_source_facts.py"

permissions:
  contents: write
  issues: write

concurrency:
  group: source-monitor
  # PR #66 (session 1ebc7e08): not cancelled mid-flight — this job commits and pushes. A
  # dispatch started while the scheduled run is between its commit and its push would kill
  # the run that already made the commit, and the result would be stranded in a disposable
  # runner instead of on the branch.
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    # A page that hangs used to hold the job (and the source-monitor group) open; the fetches
    # themselves cap at 30 s per URL inside the script (PR #66, session 1ebc7e08).
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the PDF text extractor
        # The structure sheets are PDFs; without an extractor the monitor would
        # report them as "no text" instead of comparing what they print.
        run: python -m pip install --quiet "pypdf==5.9.0"

      - name: Check every official source, including its content
        id: check
        run: |
          # A failing source checker must not be hidden by tee.
          set -euo pipefail
          args="--print --content --write-report"
          if [ "${{ inputs.accept_baseline }}" = "yes" ]; then args="$args --accept-baseline"; fi
          python3 scripts/monitor_sources.py $args | tee monitor.txt
          echo "facts_changed=$(python3 -c "import json;print(json.load(open('data/monitoring.json'))['sources_facts_changed'])")" >> "$GITHUB_OUTPUT"
          echo "rows_marked=$(python3 -c "import json;print(json.load(open('data/monitoring.json'))['rows_source_changed'])")" >> "$GITHUB_OUTPUT"
          echo "rows_layout_review=$(python3 -c "import json;print(json.load(open('data/monitoring.json')).get('rows_layout_review',0))")" >> "$GITHUB_OUTPUT"

      - name: Summarise the result
        run: |
          python3 scripts/report_monitoring.py > report.md
          {
            echo "### Source check"
            echo
            cat monitor.txt
            echo
            cat report.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the monitoring result
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/monitoring.json data/changes.json
          if [ "${{ inputs.accept_baseline }}" = "yes" ]; then git add data/source_baseline.json; fi
          if git diff --cached --quiet; then
            echo "No change in the monitoring result."
          else
            git commit -m "chore: refresh source monitoring result"
            # Retry rejected pushes but fail visibly if rebase or every push fails.
            published=false
            for attempt in 1 2 3; do
              if ! git pull --rebase origin "$GITHUB_REF_NAME"; then
                echo "Rebase failed; monitoring result was not published." >&2
                if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then git rebase --abort; fi
                exit 1
              fi
              if git push origin "HEAD:$GITHUB_REF_NAME"; then
                published=true
                break
              fi
              echo "Push attempt $attempt failed." >&2
              if [ "$attempt" -lt 3 ]; then sleep $((attempt * 15)); fi
            done
            if [ "$published" != true ]; then
              echo "All monitoring publication attempts failed." >&2
              exit 1
            fi
          fi

      - name: Open an issue when a row needs re-reading
        if: steps.check.outputs.rows_marked != '0' || steps.check.outputs.facts_changed != '0' || steps.check.outputs.rows_layout_review != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY' > report.md
          import json
          mon = json.load(open("data/monitoring.json"))
          ch = json.load(open("data/changes.json"))
          print("## Official source re-check")
          print()
          print(f"- checked: {mon['checked_at_utc']} on {mon['http_check']['ran_on']}")
          print(f"- official sources reachable: {mon['sources_ok']} / {mon['sources_total']} ({mon['kpi_basis']})")
          print(f"- pages re-rendered without a value change: {mon['sources_raw_changed'] - mon['sources_facts_changed']}")
          print(f"- pages whose published values changed: {mon['sources_facts_changed']}")
          print(f"- rows marked for re-reading: {mon['rows_source_changed']}")
          print(f"- rows needing PDF layout comparison review: {mon.get('rows_layout_review', 0)}")
          print()
          print("### Marked rows")
          print()
          for row in ch["changed"]:
              print(f"- **{row['name']}** ({row.get('date', 'no date')}, `{row['id']}`, {row.get('kind')})")
              print(f"  - {row.get('reason', '')}")
              for key, pair in (row.get("diff") or {}).items():
                  print(f"  - {key}: {pair[0]} -> {pair[1]}")
              if row.get("source_url"):
                  print(f"  - source: {row['source_url']}")
          for row in ch["added"]:
              print(f"- added **{row['name']}** ({row['date']}, `{row['id']}`)")
          for row in ch["removed"]:
              print(f"- removed **{row['name']}** ({row.get('date')}, `{row['id']}`)")
          if ch.get("layout_review"):
              print()
              print("### PDF layout comparison review (not a source-change claim)")
              print()
              for row in ch["layout_review"]:
                  print(f"- **{row.get('name')}** (`{row['id']}`, {row.get('status')})")
                  print(f"  - {row.get('reason', '')}")
                  print(f"  - source: {row.get('source_url')}")
          PY
          echo "---" >> report.md
          echo "" >> report.md
          echo "Re-read the affected structure sheets or policy pages before trusting a marked row." >> report.md
          echo "After that, re-run this workflow with 'Accept today's content as the new comparison baseline' = yes." >> report.md
          title="Source check $(date -u +%Y-%m-%d)"
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number' || true)
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file report.md >/dev/null
          else
            gh issue create --title "$title" --body-file report.md >/dev/null
          fi

      - name: Comment on the run when nothing moved
        if: steps.check.outputs.rows_marked == '0' && steps.check.outputs.facts_changed == '0' && steps.check.outputs.rows_layout_review == '0'
        run: |
          {
            echo "### No differences detected in comparable content"
            echo
            echo "No changed rows or comparable fact signatures were detected. This is not proof that"
            echo "unreachable, unreadable, or un-baselined sources are unchanged. Review the availability"
            echo "and content-status details before relying on the report. Availability: $(python3 -c "import json;m=json.load(open('data/monitoring.json'));print(f\"{m['sources_ok']} / {m['sources_total']} official sources answered (basis: {m['kpi_basis']})\")")"
          } >> "$GITHUB_STEP_SUMMARY"
