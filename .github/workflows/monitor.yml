name: Official source monitor

# Re-checks every official URL on a schedule, records a hash of each document,
# extracts facts from the official structure sheets, and commits the result.
# A row whose source changed is marked on the site (data/change_log.json).

on:
  schedule:
    - cron: "17 13 * * *"   # daily, 13:17 UTC (about 06:17 Las Vegas)
  workflow_dispatch:
  push:
    paths:
      - "scripts/collect_official.py"
      - ".github/workflows/monitor.yml"

permissions:
  contents: write

concurrency:
  group: official-monitor
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Install poppler (pdftotext)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Collect official facts
        run: python3 scripts/collect_official.py

      - name: Rebuild data and site from the collected facts
        run: |
          python3 scripts/build_data.py
          python3 scripts/build_site.py
          python3 scripts/check_links.py

      - name: Commit the collected facts
        run: |
          git config user.name "official-source-monitor"
          git config user.email "monitor@users.noreply.github.com"
          git add data/official_facts.json data/change_log.json data/tournaments.json \
                  data/schedule.json data/rates.json index.html pages
          if git diff --cached --quiet; then
            echo "No change detected in any official document."
            exit 0
          fi
          git commit -m "monitor: refresh official source facts, hashes, and change log ($(date -u +%Y-%m-%d))"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
