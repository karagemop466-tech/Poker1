name: Monitor official sources

# Checks that every official source used by the dataset still answers, records
# the result in data/monitoring.json, and lists the rows that changed since the
# last verified snapshot. When something moves, the report is posted as an
# issue so a reviewer can re-read the affected structure sheets.

on:
  schedule:
    # Daily source check. (The previous entry used a `name:` key here, which the
    # workflow schema does not accept, so the scheduled run never fired.)
    - cron: "17 7 * * *"
  workflow_dispatch:
  # The sandbox integration cannot call the dispatch API (HTTP 403), so the first
  # real run is triggered by this narrow push filter: it fires when a change to
  # this workflow file itself lands on main, which is exactly once when the change
  # adding this trigger is merged. The 07:17 UTC cron takes over afterwards.
  push:
    branches: [main]
    paths:
      - ".github/workflows/monitor.yml"

permissions:
  contents: write
  issues: write

concurrency:
  group: source-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PDF text extraction
        run: python3 -m pip install --quiet pypdf

      - name: Check every official source
        run: python3 scripts/monitor_sources.py --print | tee monitor.txt

      - name: Re-fetch the official schedule pages and diff every published row
        # Compares what the official pages print today with the published rows. A row
        # the page no longer prints, a name that changed or a start time that moved is
        # recorded in data/live_verification.json and listed in the daily issue. The
        # step does not fail the job: the issue is the deliverable, and the committed
        # file is the record. `|| true` keeps the report step running after a diff.
        run: python3 scripts/verify_live.py --print --json data/live_verification.json || true

      - name: Summarise the result
        run: |
          python3 scripts/report_monitoring.py > report.md
          {
            echo "### Source check"
            echo
            cat monitor.txt
            echo
            cat report.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the monitoring result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/monitoring.json data/changes.json data/live_verification.json
          if git diff --cached --quiet; then
            echo "No change in the monitoring result."
          else
            git commit -m "chore: refresh source monitoring result"
            git push
          fi

      - name: Publish the report as an issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY' > report.md
          import json
          mon = json.load(open("data/monitoring.json"))
          ch = json.load(open("data/changes.json"))
          print("## Official source check")
          print()
          print(f"- checked: {mon['checked_at']}")
          print(f"- sources reachable: {mon['sources_ok']} / {mon['sources_total']}")
          print(f"- unreachable: {mon['sources_unreachable']}")
          print(f"- HTTP errors: {mon['sources_http_error']}")
          print()
          live = json.load(open("data/live_verification.json"))
          print("### Live re-read of the official schedule pages")
          print()
          print(f"- mode: {live.get('mode')}")
          print(f"- sources parsed: {live['summary']['sources_ok']} / {live['summary']['sources_checked']}")
          print(f"- errors: {live['summary']['errors']}, discrepancies: {live['summary']['discrepancies']}")
          for src in live["sources"]:
              print(f"- `{src['url']}`: {src['status']}")
              if src.get("error"):
                  print(f"  - {src['error']}")
              for key in ("missing", "changed", "new"):
                  for item in src.get(key) or []:
                      print(f"  - **{key}** {item.get('date')} {item.get('start')} "
                            f"{item.get('name') or item.get('printed_name')}")
          print()
          print("### Rows that changed since the last verified snapshot")
          print()
          for row in ch["changed"]:
              print(f"- **{row['name']}** ({row['date']}, {row['id']})")
              for key, pair in row["diff"].items():
                  print(f"  - {key}: {pair[0]} -> {pair[1]}")
          for row in ch["added"]:
              print(f"- added **{row['name']}** ({row['date']}, {row['id']})")
          for row in ch["removed"]:
              print(f"- removed **{row['name']}** ({row['date']}, {row['id']})")
          if not (ch["changed"] or ch["added"] or ch["removed"]):
              print("- no row changed")
          PY
          echo "---" >> report.md
          echo "" >> report.md
          echo "Re-read the affected structure sheets before trusting the changed rows." >> report.md
          title="Source check $(date -u +%Y-%m-%d)"
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number' || true)
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file report.md >/dev/null
          else
            gh issue create --title "$title" --body-file report.md >/dev/null
          fi
