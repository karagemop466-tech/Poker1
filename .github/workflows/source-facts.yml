name: Check official source facts

on:
  schedule:
    # Weekly, on Sundays at 06:47 UTC: re-fetch every official source, refresh the
    # text snapshots under data/snapshots/ and record what changed. This job is the
    # provenance archive and cross-check for the row-level monitor in monitor.yml.
    - cron: '47 6 * * 0'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/check_source_facts.py'
      - 'data/sources.json'
      - '.github/workflows/source-facts.yml'

permissions:
  contents: write

# Only one monitor run at a time; a queued run would otherwise race on the push.
concurrency:
  group: source-facts
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PDF text extraction
        run: python -m pip install --upgrade pip pypdf

      - name: Re-check every official source
        # Output is also written into the repo so it can be reviewed without
        # downloading the Actions log. pipefail: a refusal or failure of the
        # script must fail this step even though its output is piped through tee
        # (REQUEST 2, session 206debc0: the refusal was recorded but never red).
        run: |
          set -eo pipefail
          python3 scripts/check_source_facts.py 2>&1 | tee data/monitor_last_run.txt

      - name: Summarise
        run: |
          python3 - <<'PY'
          import json
          log = json.load(open('data/change_log.json'))
          print("sources:", log['source_count'], "| changed:", log['changed_ids'], "| errors:", log['error_count'])
          for s in log['sources']:
              if s['error']:
                  print("  ERROR", s['id'], s['error'])
          with open('monitor_summary.txt', 'w') as f:
              f.write("checked %s sources, %s changed, %s errors\n" % (
                  log['source_count'], len(log['changed_ids']), log['error_count']))
          PY
          cat monitor_summary.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Commit refreshed snapshots
        run: |
          rm -f monitor_summary.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/snapshots data/change_log.json data/monitor_last_run.txt
          if git diff --cached --quiet; then
            echo "No official source changed since the last check."
          else
            git commit -m "chore: refresh official source snapshots $(date -u +%Y-%m-%d)"
            # Rebase first: the branch may have moved while this job was running.
            for attempt in 1 2 3; do
              git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && break
              echo "push attempt $attempt failed, retrying in $((attempt * 10))s"
              sleep $((attempt * 10))
            done
          fi
