name: Check official source facts

on:
  schedule:
    # Weekly, on Sundays at 06:47 UTC: re-fetch every official source, refresh the
    # text snapshots under data/snapshots/ and record what changed. This job is the
    # provenance archive and cross-check for the row-level monitor in monitor.yml.
    - cron: '47 6 * * 0'
  workflow_dispatch:
  # Never commit freshly fetched snapshots to an open feature branch just
  # because a workflow or source manifest changed in a pull request.
  push:
    branches: [main]
    paths:
      - 'scripts/check_source_facts.py'
      - 'data/sources.json'
      - '.github/workflows/source-facts.yml'

permissions:
  contents: write

# Only one monitor run at a time; a queued run would otherwise race on the push.
concurrency:
  group: source-facts
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PDF text extraction
        run: python -m pip install --upgrade pip pypdf

      - name: Re-check every official source
        # Output is also written into the repo so it can be reviewed without
        # downloading the Actions log. `set -o pipefail` makes the job fail when the
        # script exits non-zero even though its output is piped through `tee`. Without it
        # the script's own refusal (a non-official host in the manifest) was written into
        # monitor_last_run.txt while `tee` still exited 0, so the job went green on a run
        # that checked nothing. A refusal must be red.
        run: set -o pipefail; python3 scripts/check_source_facts.py 2>&1 | tee data/monitor_last_run.txt

      - name: Confirm the run actually ran
        # `set -o pipefail` above makes the job red when the script exits non-zero. This is
        # the second half: a refusal written into the log must be red even if a future
        # refactor changes the exit code, because the snapshots this job archives are the
        # evidence every quote check on the site is re-derived from.
        run: |
          set -euo pipefail
          if grep -q '^Refusing to run' data/monitor_last_run.txt; then
            grep -m1 '^Refusing to run' data/monitor_last_run.txt >&2
            echo "The provenance run refused; no official snapshot was refreshed." >&2
            exit 1
          fi
          echo "Provenance run completed; $(grep -c . data/monitor_last_run.txt) log line(s) archived."

      - name: Summarise
        run: |
          python3 - <<'PY'
          import json
          log = json.load(open('data/change_log.json'))
          print("sources:", log['source_count'], "| changed:", log['changed_ids'], "| errors:", log['error_count'])
          for s in log['sources']:
              if s['error']:
                  print("  ERROR", s['id'], s['error'])
          with open('monitor_summary.txt', 'w') as f:
              f.write("checked %s sources, %s changed, %s errors\n" % (
                  log['source_count'], len(log['changed_ids']), log['error_count']))
          PY
          cat monitor_summary.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Commit refreshed snapshots
        run: |
          set -euo pipefail
          rm -f monitor_summary.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/snapshots data/change_log.json data/monitor_last_run.txt
          if git diff --cached --quiet; then
            echo "No official source changed since the last check."
          else
            git commit -m "chore: refresh official source snapshots $(date -u +%Y-%m-%d)"
            # A rebase conflict cannot be retried as a push. Stop visibly rather
            # than reporting success from the last `sleep` in a retry loop.
            published=false
            for attempt in 1 2 3; do
              if ! git pull --rebase origin "$GITHUB_REF_NAME"; then
                echo "Rebase failed; monitoring snapshots were not published." >&2
                if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then git rebase --abort; fi
                exit 1
              fi
              if git push origin "HEAD:$GITHUB_REF_NAME"; then
                published=true
                break
              fi
              echo "Push attempt $attempt failed." >&2
              if [ "$attempt" -lt 3 ]; then sleep $((attempt * 10)); fi
            done
            if [ "$published" != true ]; then
              echo "All snapshot publication attempts failed." >&2
              exit 1
            fi
          fi
