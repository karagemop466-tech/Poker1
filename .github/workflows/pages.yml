name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install smoke-test dependencies
        run: npm ci

      - name: Rebuild the dataset from the verified sources
        run: |
          python3 scripts/build_data.py
          git diff --exit-code -- data

      - name: Confirm generated pages match committed pages
        run: |
          python3 scripts/build_site.py
          git diff --exit-code -- index.html pages

      - name: Validate JSON schemas, local links, and source links
        run: python3 scripts/check_links.py

      - name: Verify every published value against the archived official documents
        run: python3 scripts/verify_rows.py

      - name: Replay the live page checks against the archived official schedule
        # Exercises the parser used by the scheduled live check with no network needed.
        run: python3 scripts/verify_live.py --offline

      - name: Re-fetch the official schedule pages and diff every published row
        # The live half of the verification. A discrepancy (a row the official page no
        # longer prints, or a name/time that changed) fails this step so no stale row
        # can be published; an unreachable source fails it too, so a broken check is
        # never reported as a pass.
        run: |
          python3 -m pip install --quiet pypdf
          python3 scripts/verify_live.py --print --json data/live_verification.json \
            | tee live_verification.txt
          {
            echo "### Live re-read of the official schedule pages"
            echo
            cat live_verification.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the live verification result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-verification
          path: |
            data/live_verification.json
            live_verification.txt
          if-no-files-found: ignore

      - name: Check every official source and summarise the changed rows
        run: |
          python3 scripts/monitor_sources.py --print | tee monitor.txt
          {
            echo "### Source check"
            echo
            cat monitor.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Render every page in a headless DOM
        run: npm run test:smoke | tee -a "$GITHUB_STEP_SUMMARY"

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Stage public site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r pages assets data _site/
          cp EXECUTIVE_SUMMARY.md QUESTIONS.md SUGGESTIONS.md FLAGGED.md REVIEW.md README.md _site/
          for file in EXECUTIVE_SUMMARY.md QUESTIONS.md SUGGESTIONS.md FLAGGED.md REVIEW.md README.md; do
            test -s "_site/$file"
          done
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
