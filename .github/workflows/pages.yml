name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install smoke-test dependencies
        run: npm ci

      - name: Rebuild the dataset from the verified sources
        run: |
          python3 scripts/build_data.py
          git diff --exit-code -- data

      - name: Confirm generated pages match committed pages
        run: |
          python3 scripts/build_site.py
          git diff --exit-code -- index.html pages

      - name: Validate JSON schemas, local links, and source links
        run: python3 scripts/check_links.py

      # Two independent row-level checks, because they answer different questions.
      #   verify_rows.py     - value-by-value against the archived official text
      #   verify_live_rows.py - row-by-row against the document that prints the row
      - name: Verify every published value against the archived official documents
        run: python3 scripts/verify_rows.py

      - name: Verify every published row against the official document that prints it
        run: python3 scripts/verify_live_rows.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Check every official source and summarise the changed rows
        run: |
          python3 scripts/monitor_sources.py --print | tee monitor.txt
          {
            echo "### Source check"
            echo
            cat monitor.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Render every page in a headless DOM
        run: npm run test:smoke | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Assert the tables, filters, search and 30-minute walking rule work
        run: npm run test:ui | tee -a "$GITHUB_STEP_SUMMARY"

  # This repository's Pages site uses the legacy branch build (`source: main:/`). With that build type
  # `actions/deploy-pages` can never find a `github-pages` artifact, so the deploy job failed on every run
  # (run 43992732904: "No artifacts named \"github-pages\" were found for this workflow run") while the
  # site itself kept building. The job therefore asks GitHub which build type the site actually uses:
  #   workflow -> publish the artifact exactly as before;
  #   legacy   -> confirm the branch build for this exact commit reached `built`, and fail if it errored
  #               or never appeared. Either way the job's exit status now means what it says.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.site.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read the Pages configuration
        id: cfg
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          body=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages")
          build_type=$(printf '%s' "$body" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("build_type",""))')
          page_url=$(printf '%s' "$body" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("html_url",""))')
          echo "build_type=$build_type" >> "$GITHUB_OUTPUT"
          echo "page_url=$page_url" >> "$GITHUB_OUTPUT"
          echo "Pages build type: $build_type | site: $page_url"

      - name: Configure Pages
        if: steps.cfg.outputs.build_type == 'workflow'
        uses: actions/configure-pages@v5

      - name: Stage public site
        if: steps.cfg.outputs.build_type == 'workflow'
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r pages assets data _site/
          cp EXECUTIVE_SUMMARY.md QUESTIONS.md SUGGESTIONS.md FLAGGED.md REVIEW.md README.md _site/
          for file in EXECUTIVE_SUMMARY.md QUESTIONS.md SUGGESTIONS.md FLAGGED.md REVIEW.md README.md; do
            test -s "_site/$file"
          done

      - name: Upload Pages artifact
        if: steps.cfg.outputs.build_type == 'workflow'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        if: steps.cfg.outputs.build_type == 'workflow'
        uses: actions/deploy-pages@v4

      - name: Confirm the branch build for this commit is live
        if: steps.cfg.outputs.build_type != 'workflow'
        env:
          GH_TOKEN: ${{ github.token }}
          PAGE_URL: ${{ steps.cfg.outputs.page_url }}
        run: |
          set -euo pipefail
          if [ -z "$PAGE_URL" ]; then
            echo "Pages did not report a site URL." >&2
            exit 1
          fi
          # No heredocs here: the whole block is indented inside the YAML, and an indented
          # heredoc terminator is easy to get wrong across editors.
          echo "The site is published by the legacy branch build; waiting for the build of $GITHUB_SHA."
          for attempt in $(seq 1 30); do
            curl -sS -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages/builds?per_page=30" > pages_builds.json
            read -r status detail < <(python3 -c "import json,sys; sha=sys.argv[1]; bs=json.load(open('pages_builds.json')); \
            m=[b for b in bs if b.get('commit')==sha]; \
            print((m[0].get('status') if m else 'pending'), \
                  ((m[0].get('error') or {}).get('message') or '').replace(' ', '_') if m else '')" "$GITHUB_SHA")
            echo "attempt $attempt: $status $detail"
            if [ "$status" = "built" ]; then
              echo "Pages build for $GITHUB_SHA is live at $PAGE_URL"
              exit 0
            fi
            if [ "$status" = "errored" ]; then
              echo "Pages build for $GITHUB_SHA failed: $detail" >&2
              exit 1
            fi
            sleep 10
          done
          echo "Pages did not report a built state for $GITHUB_SHA within 5 minutes." >&2
          exit 1
