name: Refresh the daily feed and watch the official sources

on:
  schedule:
    # Every morning at 05:10 UTC, before the Las Vegas day starts.
    - cron: "10 5 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/scrape_daily.py"
      - "scripts/monitor_sources.py"
      - "scripts/build_daily_feed.py"
      - "data/daily_feed.json"
      - "data/source_registry.json"
      - ".github/workflows/refresh.yml"

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install text extraction tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils

      - name: Refresh the daily feed from the official documents
        run: python3 scripts/scrape_daily.py

      - name: Check the official source documents
        run: python3 scripts/monitor_sources.py

      - name: Record the current document bodies as the new baseline
        if: github.event_name == 'workflow_dispatch'
        run: python3 scripts/monitor_sources.py --update-baseline

      - name: Commit the refreshed feed if it changed
        run: |
          git config user.name  "poker-plan-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/daily_feed.json data/source_changes.json
          if git diff --cached --quiet; then
            echo "No change to the daily feed."
          else
            git commit -m "chore: refresh the official daily feed and source status"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
